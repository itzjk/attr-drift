[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attr-drift"
version = "0.1.0"
description = "Find tracked files whose Git attributes change between revisions, including unchanged blobs."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["git", "gitattributes", "code-review", "cli", "regression-testing", "continuous-integration"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: POSIX"]

[project.scripts]
attr-drift = "attr_drift.cli:main"

[project.urls]
Repository = "https://github.com/itzjk/attr-drift"
Issues = "https://github.com/itzjk/attr-drift/issues"

[tool.setuptools.packages.find]
include = ["attr_drift*"]
